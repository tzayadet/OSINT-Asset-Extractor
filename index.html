<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Asset Extractor // Web Node</title>
    <script src="./vendor/jszip.min.js"></script>
    <style>
        :root {
            --bg-main: #121212; --bg-panel: #1e1e1e; --bg-console: #0d0d0d;
            --text-main: #cccccc; --text-dim: #888888; --text-label: #aaaaaa;
            --accent-green: #81c784; --accent-red: #cf6679; --accent-orange: #ffb74d;
            --border: #333333; --input-bg: #252525;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout */
        .sidebar { width: 320px; background: var(--bg-panel); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .main { flex: 1; display: flex; flex-direction: column; background: var(--bg-console); }
        
        /* Typography & Components */
        h3 { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 15px; font-weight: 600; }
        label { font-size: 12px; color: var(--text-label); display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px 10px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main); font-family: 'Consolas', monospace; font-size: 13px; border-radius: 4px; margin-bottom: 15px; outline: none; }
        input:focus, select:focus { border-color: #555; }
        
        .btn { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: var(--text-main); font-weight: 600; cursor: pointer; border-radius: 4px; margin-bottom: 10px; transition: 0.2s; }
        .btn:hover { background: #3d3d3d; }
        .btn.active { background: #3a1c1c; border-color: var(--accent-red); color: var(--accent-red); }
        .notice { border: 1px solid #3d4a43; border-radius: 4px; padding: 10px; color: #aab6ad; font-size: 11px; line-height: 1.5; }
        .notice strong { display: block; color: var(--accent-green); margin-bottom: 4px; letter-spacing: .08em; }
        
        /* Console */
        .console-header { height: 40px; background: #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); }
        .console-header span { font-family: 'Consolas', monospace; font-size: 12px; color: #666; }
        .status { font-family: 'Consolas', monospace; font-size: 12px; color: #555; }
        .status.running { color: var(--accent-green); }
        .status.failed { color: var(--accent-red); }
        
        #console { flex: 1; padding: 15px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 13px; line-height: 1.6; }
        .log-info { color: #ccc; }
        .log-success { color: var(--accent-green); }
        .log-error { color: var(--accent-red); }
        .log-warn { color: var(--accent-orange); }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-console); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>CONFIGURACIÓN DE EXTRACCIÓN</h3>
        
        <label>Objetivo (URL)</label>
        <input type="text" id="targetUrl" placeholder="https://objetivo.com">
        
        <label>Filtro de Activos</label>
        <select id="fileType">
            <option value="ALL">TODOS (ALL)</option>
            <option value="PDF">DOCUMENTOS (PDF/DOC)</option>
            <option value="IMG">IMÁGENES (IMG)</option>
            <option value="MEDIA">ENLACES MEDIA</option>
        </select>

        <div class="notice">
            <strong>FETCH DIRECTO</strong>
            <span>El sitio objetivo debe permitir CORS. No se envían URLs ni archivos a proxies externos.</span>
        </div>

        <div style="flex: 1;"></div>
        
        <button class="btn" id="btnStart" onclick="toggleTask()">INICIAR EXTRACCIÓN</button>
        <button class="btn" onclick="clearConsole()">LIMPIAR CONSOLA</button>
    </div>

    <div class="main">
        <div class="console-header">
            <span>TELEMETRÍA Y LOGS DE EJECUCIÓN</span>
            <span class="status" id="statusIndicator">● IDLE</span>
        </div>
        <div id="console"></div>
    </div>

    <script>
        let isRunning = false;
        let activeController = null;
        const consoleEl = document.getElementById('console');
        const statusEl = document.getElementById('statusIndicator');
        const btnStart = document.getElementById('btnStart');

        function log(msg, level = 'info') {
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = `log-${level}`;
            line.textContent = `[${time}] [${level.toUpperCase()}] ${msg}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function clearConsole() {
            consoleEl.innerHTML = '';
        }

        function setStatus(text, cls) {
            statusEl.textContent = `● ${text}`;
            statusEl.className = `status ${cls}`;
        }

        function parseHttpUrl(value) {
            try {
                const parsed = new URL(value);
                if (!['http:', 'https:'].includes(parsed.protocol)) return null;
                if (!parsed.hostname || parsed.username || parsed.password) return null;
                return parsed;
            } catch {
                return null;
            }
        }

        async function toggleTask() {
            if (isRunning) {
                isRunning = false;
                if (activeController) activeController.abort();
                btnStart.textContent = "INICIAR EXTRACCIÓN";
                btnStart.classList.remove('active');
                setStatus("ABORTED", "failed");
                log("Proceso detenido por el operador.", "warn");
                return;
            }

            const url = document.getElementById('targetUrl').value.trim();
            if (!parseHttpUrl(url)) {
                log("Introduce una URL HTTP o HTTPS válida, sin credenciales.", "error");
                return;
            }

            isRunning = true;
            btnStart.textContent = "DETENER PROCESO";
            btnStart.classList.add('active');
            setStatus("RUNNING", "running");
            
            await executeExtraction(url);
        }

        async function executeExtraction(url) {
            const filter = document.getElementById('fileType').value;
            const baseUrl = parseHttpUrl(url);
            if (!baseUrl) throw new Error('URL HTTP/HTTPS no válida.');

            activeController = new AbortController();
            const signal = activeController.signal;
            const zip = new JSZip();
            let assetsFound = 0;

            log(`Iniciando extracción directa: ${baseUrl.origin}${baseUrl.pathname}`);
            log(`Filtro: ${filter} | Proxy externo: desactivado`);

            try {
                log("Solicitando DOM directamente al sitio. CORS debe estar habilitado...");
                const response = await fetch(baseUrl.href, {
                    mode: 'cors',
                    credentials: 'omit',
                    signal
                });
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                log("DOM parseado. Rastreando enlaces y activos...");

                if (['ALL', 'PDF', 'MEDIA'].includes(filter)) {
                    const links = doc.querySelectorAll('a[href]');
                    for (const link of links) {
                        if (!isRunning) break;
                        const href = link.getAttribute('href');
                        if (!href) continue;

                        const candidate = new URL(href, baseUrl);
                        if (!['http:', 'https:'].includes(candidate.protocol)) continue;
                        const fullUrl = candidate.href;
                        const ext = candidate.pathname.split('.').pop().toLowerCase();

                        const matches =
                            (filter === 'ALL' && ['pdf','doc','docx','ppt','pptx','zip','rar'].includes(ext)) ||
                            (filter === 'PDF' && ['pdf','doc','docx','ppt','pptx'].includes(ext)) ||
                            (filter === 'MEDIA' && ['mp4','mp3','avi','mkv'].includes(ext));

                        if (matches) {
                            if (await downloadAndZip(fullUrl, zip, signal)) assetsFound++;
                        }
                    }
                }

                if (['ALL', 'IMG'].includes(filter)) {
                    const images = doc.querySelectorAll('img[src]');
                    for (const image of images) {
                        if (!isRunning) break;
                        const src = image.getAttribute('src');
                        if (!src || src.startsWith('data:')) continue;

                        const candidate = new URL(src, baseUrl);
                        if (!['http:', 'https:'].includes(candidate.protocol)) continue;
                        if (await downloadAndZip(candidate.href, zip, signal)) assetsFound++;
                    }
                }

                if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');

                if (assetsFound === 0) {
                    log("No se encontraron activos coincidentes con el filtro.", "warn");
                } else {
                    log(`Generando paquete ZIP con ${assetsFound} activos descargados...`);
                    const blob = await zip.generateAsync({ type: "blob" });
                    const objectUrl = URL.createObjectURL(blob);
                    const anchor = document.createElement('a');
                    anchor.href = objectUrl;
                    anchor.download = `OSINT_Extract_${Date.now()}.zip`;
                    anchor.click();
                    URL.revokeObjectURL(objectUrl);
                    log("Paquete ZIP generado localmente.", "success");
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    log("Solicitud cancelada por el operador.", "warn");
                    setStatus("ABORTED", "failed");
                } else {
                    log(`Error en la extracción directa: ${error.message}`, "error");
                    setStatus("FAILED", "failed");
                }
            } finally {
                isRunning = false;
                activeController = null;
                btnStart.textContent = "INICIAR EXTRACCIÓN";
                btnStart.classList.remove('active');
                if (statusEl.textContent.includes("RUNNING")) setStatus("COMPLETE", "running");
            }
        }

        async function downloadAndZip(fileUrl, zip, signal) {
            const parsed = parseHttpUrl(fileUrl);
            if (!parsed) {
                log("Recurso omitido: URL HTTP/HTTPS no válida.", "warn");
                return;
            }

            try {
                const response = await fetch(parsed.href, {
                    mode: 'cors',
                    credentials: 'omit',
                    signal
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const blob = await response.blob();
                const rawName = parsed.pathname.split('/').pop() || 'asset';
                const fileName = rawName.replace(/[^A-Za-z0-9._-]+/g, '_').slice(0, 160) || 'asset';
                zip.file(fileName, blob);
                log(`Activo descargado: ${fileName}`, "success");
                return true;
            } catch (error) {
                if (error.name === 'AbortError') throw error;
                log(`Recurso omitido (CORS o descarga): ${error.message}`, "warn");
                return false;
            }
        }
    </script>
</body>
</html>
